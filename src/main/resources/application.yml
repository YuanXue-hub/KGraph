spring:
  application:
    name: SeedBoot
  profiles:
    active: local
server:
  port: 8888
  servlet:
    context-path: /api

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.yuan.seedboot.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
