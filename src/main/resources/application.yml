spring:
  application:
    name: SeedBoot
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
server:
  port: 8888
  servlet:
    context-path: /api

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.yuan.seedboot.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
