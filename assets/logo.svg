<svg width="120" height="120" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="kgCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="kgNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="100%" stop-color="#c4b5fd" />
    </linearGradient>
  </defs>
  <!-- 六边形关系骨架 -->
  <g stroke="#cbd5e1" stroke-width="1" fill="none" stroke-linecap="round">
    <line x1="24" y1="8" x2="37.86" y2="16" />
    <line x1="37.86" y1="16" x2="37.86" y2="32" />
    <line x1="37.86" y1="32" x2="24" y2="40" />
    <line x1="24" y1="40" x2="10.14" y2="32" />
    <line x1="10.14" y1="32" x2="10.14" y2="16" />
    <line x1="10.14" y1="16" x2="24" y2="8" />
  </g>
  <!-- 中心放射连线 -->
  <g stroke="#a5b4fc" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.7">
    <line x1="24" y1="24" x2="24" y2="8" />
    <line x1="24" y1="24" x2="37.86" y2="16" />
    <line x1="24" y1="24" x2="37.86" y2="32" />
    <line x1="24" y1="24" x2="24" y2="40" />
    <line x1="24" y1="24" x2="10.14" y2="32" />
    <line x1="24" y1="24" x2="10.14" y2="16" />
  </g>
  <!-- 外围 6 个知识节点 -->
  <g>
    <circle cx="24" cy="8" r="2.6" fill="url(#kgNode)" />
    <circle cx="37.86" cy="16" r="2.6" fill="url(#kgNode)" />
    <circle cx="37.86" cy="32" r="2.6" fill="url(#kgNode)" />
    <circle cx="24" cy="40" r="2.6" fill="url(#kgNode)" />
    <circle cx="10.14" cy="32" r="2.6" fill="url(#kgNode)" />
    <circle cx="10.14" cy="16" r="2.6" fill="url(#kgNode)" />
  </g>
  <!-- 中心核心节点 -->
  <circle cx="24" cy="24" r="5.5" fill="url(#kgCore)" />
  <circle cx="24" cy="24" r="2.2" fill="#ffffff" opacity="0.85" />
</svg>
